# Runs the Playwright end-to-end suite against the production build on every push.
#
# This workflow is deliberately separate from deploy.yml and does not gate it. The runner
# has no GPU, so WebGL goes through SwiftShader on the CPU: context creation, frame times
# and every timing budget in the suite differ from the owner's machine. Whether the suite is
# green here says something about the suite on this runner, not about the site, and the
# first three deploys were blocked for five days by exactly that confusion.
#
# What it is for: a red X on the commit that anyone can read without repository admin
# rights. The `github` reporter writes each failure as an annotation on the run summary, the
# `setup` project in playwright.config.ts fails inside a minute (with the renderer string)
# if WebGL never came up, and the HTML report with screenshots and traces is uploaded as an
# artifact for the owner to download.
name: End-to-end tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The suite's own globalTimeout (playwright.config.ts) is the inner bound; this is the
    # outer one so a hung browser can never hold the job for GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        # On success and on failure, but not when the run was cancelled by hand.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
