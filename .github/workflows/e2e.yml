# Runs the part of the Playwright suite that a GPU-less runner can execute, on every push.
#
# This workflow is deliberately separate from deploy.yml and does not gate it. The runner
# has no GPU, so WebGL goes through SwiftShader on the CPU. Measured on the first run of the
# full suite here (2026-09-17, 4 vCPUs): the WebGL probe and the DOM-only admin and /lite/
# tests passed, every cockpit test blew its 60 s budget because the cockpit interior renders
# at seconds per frame, one test lost its browser session outright, and 58 tests never ran
# before the 20-minute global timeout. Raising the budgets would make a slow red run a very
# slow red run; the scene tests need a GPU, so they run on the owner's machine as the gate
# in `npm run publish:site`, which is the only path to the public branch.
#
# What runs here: the `setup` project (the 3D site boots in a browser without a GPU — the
# WebGL gate and the /lite/ redirect are real regression risks) and the admin and /lite/
# suites, which do not touch the canvas. Failures are annotations on the run summary
# (readable without admin rights) and the HTML report is uploaded as an artifact.
name: End-to-end tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The suite's own globalTimeout (playwright.config.ts) is the inner bound; this is the
    # outer one so a hung browser can never hold the job for GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # File filters do not skip the `setup` dependency project; it always runs first.
      - name: End-to-end tests (boot probe, admin studio, simplified site)
        run: npx playwright test tests/e2e/admin.spec.ts tests/e2e/lite.spec.ts

      - name: Upload the Playwright report
        # On success and on failure, but not when the run was cancelled by hand.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
