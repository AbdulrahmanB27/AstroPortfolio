<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Off course — Abdulrahman Bahjat</title>
    <style>
      html, body { height: 100%; margin: 0; background: #05060a; color: #ece7dc; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; text-align: center; }
      .star { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fff1cf, #f2b45a 62%, #a25a1c); box-shadow: 0 0 26px 4px rgba(242, 180, 90, 0.22); }
      h1 { margin: 0; font-size: 13px; font-weight: 400; letter-spacing: 0.34em; text-transform: uppercase; }
      p { margin: 0; color: rgba(236, 231, 220, 0.66); max-width: 34ch; line-height: 1.5; }
      a { color: #17110a; background: #f2b45a; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <span class="star" aria-hidden="true"></span>
      <h1>Abdulrahman Bahjat</h1>
      <p>This page drifted off course. The portfolio is back at the home planet.</p>
      <a id="home" href="/">Return to the portfolio</a>
    </main>
    <script>
      // GitHub Pages serves this file for any unknown path. Project sites live under /<repository>/.
      var seg = location.pathname.split('/')[1]
      var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/'
      document.getElementById('home').setAttribute('href', base)
    </script>
  </body>
</html>
